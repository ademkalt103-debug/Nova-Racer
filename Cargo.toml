[workspace]
members = ["crates/core", "crates/client", "crates/server"]
default-members = ["crates/core", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
nova-core = { path = "crates/core" }

[profile.release]
lto = true
opt-level = "s"
